<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Anemi-Care</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <img src="images/eye-logo.png" alt="Anemi-Care Logo" class="login-logo">
      <h1 class="login-title">Anemi-Care</h1>
      <p class="login-subtitle">University of Puerto Rico - Mayagüez</p>
      <form class="login-form" id="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <button type="submit" class="login-button">Log In</button>
      </form>
      <div class="login-links">
        <a href="#" class="login-link">Forgot your password? <strong>Reset it</strong></a>
        <a href="#" class="login-link">Don't have an account? <strong>Register</strong></a>
      </div>
    </div>
  </div>
  <script>
    const loginForm = document.getElementById('login-form');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault(); // Prevent the default form submission
      window.location.href = 'index.html'; // Redirect to the dashboard
    });
  </script>
</body>
</html>
