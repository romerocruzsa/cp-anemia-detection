<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Healthcare Portal</title>
    <link rel="stylesheet" href="website/css/login.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <img src="website/assets/images/logo.png" alt="Company Logo" class="logo", width="250">
            <h2 id="form-title">Anemicare Portal</h2>
            <form id="auth-form">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                
                <button type="submit" id="submit-btn">Login</button>
            </form>
            <!-- <p id="error-message" class="hidden">Invalid credentials. Please try again.</p> -->
            <p id="toggle-auth">Don't have an account? <a href="#" onclick="toggleAuth()">Sign up here</a></p>
        </div>
    </div>

    <!-- Admin override button -->
    <button id="admin-button" onclick="adminAccess()">Admin</button>

    <script>
        let isSignUp = false; // Tracks if the user is signing up

        function toggleAuth() {
            isSignUp = !isSignUp;
            document.getElementById("submit-btn").innerText = isSignUp ? "Sign Up" : "Login";
            document.getElementById("toggle-auth").innerHTML = isSignUp ? 'Already have an account? <a href="#" onclick="toggleAuth()">Login here</a>' : 'Don\'t have an account? <a href="#" onclick="toggleAuth()">Sign up here</a>';
        }

        document.getElementById("auth-form").addEventListener("submit", function(event) {
            event.preventDefault();

            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let hashedPassword = CryptoJS.SHA256(password).toString();

            if (isSignUp) {
                if (localStorage.getItem(username)) {
                    alert("Username already exists. Please choose another.");
                } else {
                    localStorage.setItem(username, hashedPassword);
                    localStorage.setItem("isLoggedIn", "true");
                    alert("Account created successfully!");
                    window.location.href = "home.html"; // Redirect to home page
                }
            } else {
                if (localStorage.getItem(username) === hashedPassword) {
                    localStorage.setItem("isLoggedIn", "true");
                    alert("Login successful!");
                    window.location.href = "home.html"; // Redirect to home page
                } else {
                    document.getElementById("error-message").classList.remove("hidden");
                }
            }
        });

        function adminAccess() {
            localStorage.setItem("isLoggedIn", "true");
            window.location.href = "home.html";
        }

        // Redirect to home if already logged in
        window.onload = function() {
            if (localStorage.getItem("isLoggedIn") === "true") {
                window.location.href = "home.html"; // Redirect if already logged in
            }
        };
    </script>

    <style>
        #admin-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: crimson;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</body>
</html>
