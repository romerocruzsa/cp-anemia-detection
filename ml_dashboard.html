<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Distributed Monitor Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card { margin-bottom: 1rem; }
    .status-idle { background-color: #f0ad4e; }
    .status-offline { background-color: #d9534f; }
    .status-active { background-color: #5cb85c; }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <h1 class="mb-4">Distributed Edge Monitoring</h1>
    <div id="dashboard" class="row row-cols-1 row-cols-md-2 g-4">
      <!-- Cards go here -->
    </div>
  </div>

  <script>
    async function fetchWorkerData() {
        try {
        const res = await fetch("http://localhost:8000/status");
        const workers = await res.json();
        updateDashboard(workers);
        } catch (err) {
        console.error("Failed to fetch status:", err);
        }
    }
  
    function updateDashboard(workers) {
      const container = document.getElementById('dashboard');
      container.innerHTML = '';
      workers.forEach(worker => {
        const card = document.createElement('div');
        card.className = "col";
  
        card.innerHTML = `
          <div class="card shadow">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <h5 class="card-title">${worker.id}</h5>
                <span class="badge ${getStatusClass(worker.status)}">${worker.status}</span>
              </div>
              <div class="progress my-2">
                <div class="progress-bar" role="progressbar" style="width: ${worker.progress}%">${worker.progress}%</div>
              </div>
              <ul class="list-group list-group-flush">
                <li class="list-group-item">Accuracy: ${worker.accuracy !== null ? (worker.accuracy * 100).toFixed(2) + '%' : '-'}</li>
                <li class="list-group-item">Loss: ${worker.loss !== null ? worker.loss.toFixed(3) : '-'}</li>
              </ul>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }
  
    function getStatusClass(status) {
      return {
        "active": "bg-success",
        "idle": "bg-warning text-dark",
        "offline": "bg-danger"
      }[status] || "bg-secondary";
    }
  
    // updateDashboard() and the rest remains same as earlier version
    setInterval(fetchWorkerData, 3000);
    fetchWorkerData();
  </script>
</body>
</html>
