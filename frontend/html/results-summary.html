<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results Records</title>
  <script src="/frontend/js/include-sidebar.js" defer></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 font-inter min-h-screen flex flex-col md:flex-row">
  <!-- Sidebar -->
  
  <aside class="w-full md:w-64 bg-black shadow-md p-6 flex flex-col justify-between min-h-screen">
    <div id="sidebar-container"></div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col">
    <header class="bg-white shadow px-6 py-4 flex items-center justify-between">
      <h2 class="text-xl font-semibold text-gray-800">Records View</h2>
      <button id="logout-btn" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-400">Log Out</button>
    </header>
    <main class="p-6 space-y-6">
        <!-- Account Information Header -->
        <div class="sticky top-0 z-10 bg-gray-50 p-3 rounded-lg">
          <h2 class="text-xl font-bold text-gray-800">Patient Records</h2>
          <p class="text-sm text-gray-500">View your previous results, recommedations, and more </p>
        </div><div class="bg-white p-4 rounded-lg shadow">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between space-y-4 md:space-y-0 md:space-x-4">
          <input type="text" placeholder="Search results..." class="w-full md:w-1/3 border px-3 py-2 rounded" id="search-input">
          <div class="flex flex-wrap items-center gap-4">
            <label class="text-sm">Date: <input type="date" id="date-filter" class="border px-2 py-1 rounded"></label>
            <label class="text-sm">Remark:
              <select id="anemia-filter" class="border px-2 py-1 rounded">
                <option value="">All</option>
                <option value="No">No</option>
                <option value="Moderate">Mild</option>
                <option value="Moderate">Moderate</option>
                <option value="Severe">Severe</option>
              </select>
            </label>
            <label class="text-sm">Sort By:
              <select id="sort-by" class="border px-2 py-1 rounded">
                <option value="date-asc">Date (Ascending)</option>
                <option value="date-desc">Date (Descending)</option>
                <option value="hb-asc">Hemoglobin Level (Ascending)</option>
                <option value="hb-desc">Hemoglobin Level (Descending)</option>
              </select>
            </label>
            <button id="apply-filters" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Apply Filters</button>
            <button id="clear-filters" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Clear Filters</button>
          </div>
        </div>
        <div id="result-count" class="text-sm italic text-gray-500 text-right mt-2"></div>
        <div class="overflow-x-auto mt-4">
          <table class="min-w-full text-sm text-left border-collapse">
            <thead class="text-gray-700 border-b">
              <tr>
                <th class="py-2 px-4">Sample</th>
                <th class="py-2 px-4">Patient ID</th>
                <th class="py-2 px-4">Date</th>
                <th class="py-2 px-4">Time</th>
                <th class="py-2 px-4">Hemoglobin Level</th>
                <th class="py-2 px-4">Remark</th>
                <th class="py-2 px-4">Doctor</th>
                <th class="py-2 px-4">Hospital</th>
              </tr>
            </thead>
            <tbody id="results-table"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Contact PCP Modal -->
  <div id="contact-pmp-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 transition-opacity duration-300 ease-out">
    <div class="bg-white p-6 rounded-lg shadow-xl max-w-md w-full relative transform scale-95 opacity-0 transition-all duration-300 ease-out" id="contact-modal-content">
      <button class="absolute top-2 right-2 text-gray-500 hover:text-gray-700" onclick="closeContactModal()">&times;</button>
      <h2 class="text-xl font-semibold mb-4">Contact PCP</h2>
      <textarea class="w-full p-2 border rounded mb-4" rows="4" placeholder="Type your message here..."></textarea>
      <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Send</button>
    </div>
  </div>
  <script src="../js/results-summary.js"></script>
</body>
</html>
