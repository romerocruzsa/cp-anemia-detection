<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Anemicare</title>

  <!-- External Fonts and Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-inter min-h-screen flex items-center justify-center">
  <!-- Login Page Container -->
  <div class="bg-white shadow-lg rounded-lg p-8 max-w-md w-full">
    <!-- Logo and Title Section -->
    <div class="text-center mb-6">
      <img src="/frontend/static/images/logo.png" alt="Anemi-Care Logo" class="w-16 h-16 mx-auto mb-4" />
      <h1 class="text-2xl font-bold text-gray-800">Anemicare</h1>
      <p class="text-sm text-gray-500"></p>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-4" autocomplete="off" aria-labelledby="login-title">
      <!-- Email Field -->
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700">Email Address</label>
        <input
          type="email"
          id="username"
          name="username"
          placeholder="you@example.com"
          class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200"
          required
        />
      </div>

      <!-- Password Field -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200"
          required
        />
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-gradient-to-r from-purple-600 to-purple-500 text-white font-medium py-2 rounded-xl hover:from-purple-700 hover:to-purple-600 transition duration-200 focus:outline-none focus:ring-2 focus:ring-purple-400"
      >
        Log In
      </button>
    </form>

    <!-- Additional Links -->
    <div class="mt-6 text-center space-y-2">
      <a href="underconstruction.html" class="text-sm text-black-700 hover:underline">Forgot your password? <strong>Reset it</strong></a>
      <p class="text-sm">
        Don't have an account? <a href="register.html" class="text-black-600 hover:underline"><strong>Register</strong></a>
      </p>
      <p class="text-sm">
        Want to test our Early Anemia Screening AI? <a href="../../index.html" class="text-black-600 hover:underline"><strong>Click Here</strong></a>
      </p>
    </div>
  </div>

  <!-- Login Form Submission Script -->
  <script>
    const loginForm = document.getElementById('login-form');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault(); // Prevent form submission for redirect
      window.location.href = 'capture.html'; // Redirect after login
    });
  </script>
</body>
</html>
