<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Anemicare</title>

  <!-- External Fonts and Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-inter min-h-screen flex items-center justify-center">
  <!-- Login Page Container -->
  <div class="bg-white shadow-lg rounded-lg p-8 max-w-md w-full">
    <!-- Logo and Title Section -->
    <div class="text-center mb-6">
      <img src="/frontend/static/images/logo.png" alt="Anemi-Care Logo" class="w-16 h-16 mx-auto mb-4" />
      <h1 class="text-2xl font-bold text-gray-800">Anemicare</h1>
      <p class="text-sm text-gray-500"></p>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-4" autocomplete="off">
      <!-- Email Field -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
          required
        />
      </div>

      <!-- Password Field -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
          required
        />
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white font-medium py-2 rounded-xl hover:from-blue-700 hover:to-blue-600 transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-400"
      >
        Log In
      </button>
    </form>

    <!-- Additional Links -->
    <div class="mt-6 text-center space-y-2">
      <a href="underconstruction.html" class="text-sm text-gray-700 hover:underline">Forgot your password? <strong>Reset it</strong></a>
      <p class="text-sm">
        Don't have an account? <a href="register.html" class="text-blue-600 hover:underline"><strong>Register</strong></a>
      </p>
      <p class="text-sm">
        Want to test our Early Anemia Screening AI? <a href="../../index.html" class="text-blue-600 hover:underline"><strong>Click Here</strong></a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://localhost:8000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            Email: email,
            Password: password
          })
        });

        const data = await response.json();

        if (response.ok) {
          // Store user information in localStorage
          localStorage.setItem('userID', data.UserID);
          localStorage.setItem('role', data.Role);
          
          // Store role-specific ID and redirect to capture page
          switch(data.Role) {
            case 'patient':
              localStorage.setItem('patientID', data.PatientID);
              window.location.href = 'capture.html';
              break;
            case 'clinician':
              localStorage.setItem('clinicianID', data.ClinicianID);
              window.location.href = 'capture.html';
              break;
            case 'administrator':
              localStorage.setItem('adminID', data.AdminID);
              window.location.href = 'capture.html';
              break;
            default:
              throw new Error('Invalid user role');
          }
        } else {
          alert(data.detail || 'Login failed. Please try again.');
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('An error occurred during login. Please try again.');
      }
    });
  </script>
</body>
</html>
