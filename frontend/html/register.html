<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Anemicare</title>

  <!-- External Fonts and Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-inter min-h-screen flex items-center justify-center">
  <!-- Registration Page Container -->
  <div class="bg-white shadow-lg rounded-lg p-8 max-w-2xl w-full">
    <!-- Logo and Title Section -->
    <div class="text-center mb-6">
      <img src="/frontend/static/images/logo.png" alt="Anemi-Care Logo" class="w-16 h-16 mx-auto mb-4" />
      <h1 class="text-2xl font-bold text-gray-800">Anemicare</h1>
    </div>

    <!-- Registration Form -->
    <form id="register-form" class="space-y-6" autocomplete="off">

      <!-- Personal Information -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="first-name" class="block text-sm font-medium text-gray-700">First Name</label>
          <input type="text" id="first-name" name="first-name" class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200" placeholder="Enter your first name" required />
        </div>
        <div>
          <label for="last-name" class="block text-sm font-medium text-gray-700">Last Name</label>
          <input type="text" id="last-name" name="last-name" class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200" placeholder="Enter your last name" required />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="dob" class="block text-sm font-medium text-gray-700">Date of Birth</label>
          <input type="date" id="dob" name="dob" class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200" required />
        </div>
        <div>
          <label for="sex" class="block text-sm font-medium text-gray-700">Legal Sex</label>
          <select id="sex" name="sex" class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200" required>
            <option value=""></option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <!-- Contact Information -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200" placeholder="you@example.com" required />
      </div>
      <div>
        <label for="phone" class="block text-sm font-medium text-gray-700">Mobile Phone</label>
        <input type="tel" id="phone" name="phone" class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200" placeholder="e.g., 787-555-1234" required />
      </div>

      <!-- Address Information -->
      <div>
        <label for="address" class="block text-sm font-medium text-gray-700">Street Address</label>
        <input type="text" id="address" name="address" class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200" placeholder="Enter your address" required />
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label for="city" class="block text-sm font-medium text-gray-700">City</label>
          <input type="text" id="city" name="city" class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200" placeholder="City" required />
        </div>
        <div>
          <label for="state" class="block text-sm font-medium text-gray-700">State/Province</label>
          <input type="text" id="state" name="state" class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200" placeholder="State" required />
        </div>
        <div>
          <label for="zip" class="block text-sm font-medium text-gray-700">ZIP Code</label>
          <input type="text" id="zip" name="zip" class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition duration-200" placeholder="ZIP Code" required />
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-purple-500 text-white font-medium py-2 rounded-xl hover:from-purple-700 hover:to-purple-600 transition duration-200 focus:outline-none focus:ring-2 focus:ring-purple-400">
        Create Account
      </button>
    </form>

    <!-- Additional Links -->
    <div class="mt-6 text-center space-y-2">
      <p class="text-sm">
        Already have an account? <a href="login.html" class="text-black-600 hover:underline"><strong>Login</strong></a>
      </p>
    </div>
  </div>

  <script>
    const registerForm = document.getElementById('register-form');

    registerForm.addEventListener('submit', (e) => {
      e.preventDefault(); // Prevent form submission for now
      alert('Registration form submitted!');
    });
  </script>
</body>
</html>
