<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Submission</title>
  <script src="/frontend/js/include-sidebar.js" defer></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-inter min-h-screen flex flex-col md:flex-row">

  <div id="sidebar-container"></div>
  
  <!-- Main Content -->
  <div class="flex-1 flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow px-6 py-4 flex items-center justify-between">
      <h2 class="text-xl font-semibold text-gray-800">Sample Submission</h2>
      <button id="logout-btn" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">Log Out</button>
    </header>

    <!-- Main Section -->
    <main class="p-6 space-y-6">
      <div class="bg-white p-6 rounded-lg shadow">
        <h3 class="text-lg font-bold mb-4">Upload or Capture New Sample</h3>

        <input type="file" accept="image/*" id="sample-upload" class="mb-4 block" />

        <div class="relative w-full max-w-md mx-auto mb-4">
          <video id="camera-stream" autoplay playsinline class="w-full max-h-64 rounded hidden"></video>
          <div id="camera-overlay" class="absolute inset-0 flex items-center justify-center pointer-events-none hidden">
            <div class="w-28 h-28 border-4 border-dashed border-red-500 rounded-xl"></div>
          </div>
        </div>

        <div class="flex flex-wrap gap-3 mb-4">
          <button id="start-camera" class="px-4 py-2 bg-white text-black hover:underline">Set Camera</button>
          <button id="capture-btn" class="px-4 py-2 bg-blue-500 text-white rounded hidden">Capture</button>
          <button id="analyze-btn" class="px-4 py-2 bg-indigo-600 text-white rounded hidden">Analyze</button>
          <button id="clear-sample" class="px-4 py-2 bg-red-500 text-white rounded hidden">Clear</button>
        </div>

        <canvas id="snapshot-canvas" class="hidden"></canvas>

        <div id="sample-preview" class="grid gap-4 md:grid-cols-9 rounded mt-6 h-full w-full"></div>
      </div>

      <div id="screening-results" class="space-y-6"></div>
    </main>
  </div>

  <!-- Contact PCP Modal -->
  <div id="contact-pmp-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl max-w-md w-full relative">
      <button class="absolute top-2 right-2 text-gray-500 hover:text-gray-700" onclick="document.getElementById('contact-pmp-modal').classList.add('hidden')">&times;</button>
      <h2 class="text-xl font-semibold mb-4">Contact PCP</h2>
      <textarea class="w-full p-2 border rounded mb-4" rows="4" placeholder="Type your message here..."></textarea>
      <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Send</button>
    </div>
  </div>

  <!-- Schedule Modal -->
  <div id="schedule-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
      <h2 class="text-xl font-bold mb-4">Schedule Appointment</h2>
      <label class="block mb-2 text-sm">Preferred Date & Time:</label>
      <input type="datetime-local" id="appt-datetime" class="w-full border p-2 rounded mb-4" />
      <div class="flex justify-end gap-2">
        <button id="cancel-schedule" class="px-4 py-2 bg-gray-200 rounded">Cancel</button>
        <button id="confirm-schedule" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Confirm</button>
      </div>
    </div>
  </div>

  <script src="../js/capture.js"></script>
</body>
</html>
