<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Log</title>
  <script src="/frontend/js/include-sidebar.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 font-inter min-h-screen flex flex-col md:flex-row">

    <div id="sidebar-container"></div>


  <!-- Main Content -->
  <div class="flex-1 flex flex-col">
    <header class="bg-white shadow px-6 py-4 flex items-center justify-between">
      <h2 class="text-xl font-semibold text-gray-800">Audit Log</h2>
      <button id="logout-btn" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-400">
        Log Out
      </button>
    </header>

    <main class="p-6 space-y-6">
      <div class="bg-white p-4 rounded-lg shadow">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-semibold text-gray-700">Audit Log</h3>
          <button onclick="clearAuditLog()" class="text-sm text-red-500 hover:underline">
            Clear Log
          </button>
        </div>
        <ul id="audit-log" class="text-sm text-gray-600 space-y-1 bg-gray-50 p-3 rounded overflow-y-auto max-h-48 border border-gray-200"></ul>
      </div>
    </main>
  </div>

  <script>
    const auditLogEl = document.getElementById('audit-log');
    const userId = '789087';

    async function fetchUserIP() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        return data.ip;
      } catch {
        return 'unknown';
      }
    }

    function logAction(msg) {
      const time = new Date().toLocaleString();
      fetchUserIP().then(ip => {
        const entry = document.createElement('li');
        entry.textContent = `[${time}] User ID: ${userId}, IP: ${ip} — ${msg}`;
        auditLogEl.prepend(entry);
      });
    }

    function clearAuditLog() {
      auditLogEl.innerHTML = '';
      logAction('Audit log cleared');
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      logAction('User logged out');
      window.location.href = 'login.html';
    });

    document.getElementById('more-info-btn').addEventListener('click', (e) => {
      const info = document.getElementById('patient-info');
      info.classList.toggle('hidden');
      e.target.textContent = info.classList.contains('hidden') ? 'More patient info' : 'Hide patient info';
      logAction('Toggled patient info');
    });

    document.getElementById('contact-pcp-btn').addEventListener('click', () => {
      logAction('Opened Contact PCP modal');
    });

    window.addEventListener('DOMContentLoaded', () => {
      const dummyLogs = [
        'Logged in',
        'Viewed Dashboard',
        'Viewed Records Page',
        'Applied filters on records table',
        'Opened Contact PCP modal'
      ];
      dummyLogs.forEach(log => logAction(log));
    });
  </script>
</body>
</html>
