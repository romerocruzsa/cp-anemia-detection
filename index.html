<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Anemicare Dashboard</title>
    <link rel="stylesheet" href="website/css/style.css">
    <script src="website/js/script.js" defer></script>
</head>
<body>
    <header>
        <div class="container">
            <img src="website/assets/images/logo.png" alt="Anemicare Logo" class="logo">
            <h1>Anemicare Dashboard</h1>
        </div>
    </header>

    <main class="container">
        <section class="upload-section">
            <h2>Upload Image of Your Eye</h2>
            <input type="file" id="imageUpload" accept="image/*" class="file-input">
            <button id="submitButton">Submit</button>
        </section>

        <section class="prediction-results">
            <h2>Prediction Results</h2>
            <p id="predictionStatus">Please upload an image for analysis.</p>
            <p id="hemoglobinLevel"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Anemicare. All Rights Reserved.</p>
    </footer>
</body>
</html>
